status                  = "unknown"
handler_register_call   = "none -- the dispatch spine is on the canvas"
handler_body_shape      = "none -- register accepts an expression_path and does not persist it"
dispatch_read_site      = "main.pd -- the §6.6 longest-prefix walk (walk_prefix/tree_get/type==system/handler), then dispatch; src/main.pd:71, :85"
consumer_register_call  = "none -- no in-process emit-consumer registration surface"
frame_budget_accessor   = "absent"
handle_lifecycle        = "absent -- unregister is the wire op"
packaging_unit          = "undeclared -- no [publishing] block"
package_name            = "undeclared"
