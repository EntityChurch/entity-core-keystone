# CI — entity-core-protocol-smalltalk (the cohort's first pure-object / live-image /
# message-passing probe #26) conformance gates. Authored at S5 (PHASE-S5 §"CI config"), matching
# the Forth/Rexx/Prolog/Zig cohort offline-gate pattern. Runs the three green gates entirely
# inside the pinned `pharo-toolchain` Podman image, sealed-offline (`--network=none`): the C-ABI
# codec `.so` is byte-built by run-s2.sh inside the image (nothing fetched at build time), the
# Tonel packages are filed into a fresh base image + snapshotted (`make image`), and the Go
# `validate-peer` oracle is a CGO_ENABLED=0 ELF that runs in the same image sharing one loopback.
#
# DELIBERATELY NOT WIRED TO ANY REMOTE/CD. There is no deploy step, no registry push, no
# publish — `/entity-rosetta` never publishes (lifecycle §Publishing); the operator decides.
# This file documents the reproducible offline gate; whether/where it actually runs (this peer's
# standalone repo's CI, or a keystone-wide CI home) is an operator/arch decision. It is committed
# for reviewability, not because a runner is attached. (Rexx/Tcl/COBOL — the closest `make dist`
# probes — ship none; this is the additive offline-gate pattern the FFI cohort peers carry, as
# Forth #25 did.)
#
# Assumptions when wired: the runner has Podman, the `pharo-toolchain:latest` image is built
# (containers/pharo-toolchain/Containerfile) and the oracle ELFs are vendored to
# output/s4-oracles/ (rebuild per status/CONFORMANCE-REPORT.md). Paths below assume the keystone
# repo root is the checkout root. Cap every podman run per RESOURCE-CAPS.md.

name: smalltalk-conformance

on:
  push:
    paths:
      - 'protocol-generator/smalltalk/**'
      - 'protocol-generator/shared/spec-data/**'
      - 'protocol-generator/shared/test-vectors/**'
      - 'ffi-generator/c-abi/**'
  pull_request:
    paths:
      - 'protocol-generator/smalltalk/**'
  workflow_dispatch: {}

# No deploy/publish permissions — read-only.
permissions:
  contents: read

env:
  IMAGE: entity-core-keystone/pharo-toolchain:latest

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain image is built from containers/pharo-toolchain/Containerfile (Pharo 13.0
      # build.732 + VM, SHA-256-pinned) and the oracle ELFs rebuilt from entity-core-go @cc1970f
      # per the CONFORMANCE-REPORT runbook. In a standalone-repo lift-out these become a
      # `podman build` + an oracle-vendor step (or a pre-built image pulled from a trusted
      # internal registry); kept explicit, not assumed.
      - name: Verify toolchain image + oracle present
        run: |
          . tools/podman-caps.sh
          podman image exists "$IMAGE" || { echo "::error::build $IMAGE from containers/pharo-toolchain/Containerfile first"; exit 1; }
          test -x output/s4-oracles/validate-peer || { echo "::error::vendor the validate-peer oracle ELF (CONFORMANCE-REPORT.md)"; exit 1; }

      # Gate 1 — S2 FFI-hybrid codec wire-conformance (must stay 69/69) + crypto accept-path +
      # the bignum uint64 [2^63, 2^64-1] boundary self-test, sealed offline. run-s2.sh byte-builds
      # libentitycore_codec.so, loads the Tonel packages into a snapshotted image, then runs the
      # 69-vector corpus.
      - name: S2 — codec 69/69 + crypto accept + uint64 boundary
        run: |
          . tools/podman-caps.sh
          podman run $PODMAN_RUN_CAPS --rm --network=none -v "$PWD":/work:Z -w /work \
            "$IMAGE" protocol-generator/smalltalk/run-s2.sh

      # Gate 2 — S3 peer machinery: foundation self-test 25/25 + two-peer loopback smoke 6/6
      # (in-process native Sockets + UFFI crypto; loopback works under --network=none).
      - name: S3 — foundation self-test 25/25 + loopback smoke 6/6
        run: |
          . tools/podman-caps.sh
          podman run $PODMAN_RUN_CAPS --rm --network=none -v "$PWD":/work:Z -w /work \
            "$IMAGE" protocol-generator/smalltalk/run-s3.sh

      # Gate 3 — S4 live-peer validate-peer --profile core (must stay 0 FAIL). The Pharo host +
      # the Go oracle ELF run together in the image over loopback, --network=none. run-s4.sh
      # writes status/CONFORMANCE-REPORT.json; we assert summary.failed == 0 (the green gate).
      - name: S4 — validate-peer --profile core (0 FAIL)
        run: |
          . tools/podman-caps.sh
          podman run $PODMAN_RUN_CAPS --rm --network=none -v "$PWD":/work:Z -w /work -e ORACLE_TIMEOUT=10m \
            "$IMAGE" protocol-generator/smalltalk/run-s4.sh
          python3 - <<'PY'
          import json, sys
          s = json.load(open("protocol-generator/smalltalk/status/CONFORMANCE-REPORT.json"))["summary"]
          print("summary:", s)
          if s.get("failed", 1) != 0:
              print("::error::validate-peer core has FAILs — gate not green"); sys.exit(1)
          PY
