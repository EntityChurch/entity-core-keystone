# CI — entity-core-protocol-julia (Tier-3 corroboration / generator-robustness peer)
# conformance gates.
#
# Authored at S5 (PHASE-S5 §"CI config"), matching the cohort per-peer offline-gate pattern
# (protocol-generator/{prolog,zig,haskell,swift,fortran}/.github/workflows/). Runs the three
# green gates entirely inside the pinned `julia-toolchain` Podman image, sealed-offline
# (--network=none): the pure-Julia codec + peer are in-repo; SHA/Sockets/Test are Julia
# stdlibs bundled in the image; Ed25519 is system libsodium via ccall (image-provided, nothing
# fetched at build time); and the Go `validate-peer` oracle is a CGO_ENABLED=0 fedora:43 ELF
# that runs in the same image sharing one loopback. The core peer pulls ZERO registered
# packages, so it loads + precompiles fully offline.
#
# DELIBERATELY NOT WIRED TO ANY REMOTE/CD. No deploy, no registry push, no Registrator /
# General-registry submission — `/entity-rosetta` never publishes (lifecycle §Publishing); the
# operator decides. This file documents the reproducible offline gate; whether/where it
# actually runs (this peer's standalone-repo CI, or a keystone-wide CI home) is an operator/arch
# decision. Committed for reviewability, not because a runner is attached (a committed CI
# workflow is otherwise deferred cohort-wide).
#
# Assumptions when wired: the runner has Podman, the `julia-toolchain:latest` image is built
# (containers/julia-toolchain/Containerfile) and the oracle ELFs are vendored to
# output/s4-oracles/ (rebuild via tools/oracle-bootstrap.sh, pin tools/oracle-pin.env @cc1970f).
# Paths below assume the keystone repo root is the checkout root.

name: julia-conformance

on:
  push:
    paths:
      - 'protocol-generator/julia/**'
      - 'protocol-generator/shared/spec-data/**'
      - 'protocol-generator/shared/test-vectors/**'
  pull_request:
    paths:
      - 'protocol-generator/julia/**'
  workflow_dispatch: {}

# No deploy/publish permissions — read-only.
permissions:
  contents: read

env:
  IMAGE: entity-core-keystone/julia-toolchain:latest

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain image is built from containers/julia-toolchain/Containerfile (julia 1.11.5
      # + system libsodium) and the oracle ELFs rebuilt from entity-core-go @cc1970f per
      # tools/oracle-bootstrap.sh. In a standalone-repo lift-out these become a `podman build` +
      # an oracle-vendor step (or a pre-built image pulled from a trusted internal registry);
      # kept explicit, not assumed.
      - name: Verify toolchain image + oracle present
        run: |
          podman image exists "$IMAGE" || { echo "::error::build $IMAGE from containers/julia-toolchain/Containerfile first"; exit 1; }
          test -x output/s4-oracles/validate-peer || { echo "::error::vendor the validate-peer oracle ELF (tools/oracle-bootstrap.sh, pin tools/oracle-pin.env @cc1970f)"; exit 1; }

      # Gate 1 — S2 codec wire-conformance (must stay 71/71), sealed offline. run-conformance.sh
      # runs the hand-rolled pure-Julia codec against the pinned v0.8.0 ECF corpus via
      # `julia --project=. test/conformance.jl <fixture>` (A-JULIA-009: NOT Pkg.test(), which
      # would git-clone the General registry under --network=none).
      - name: S2 — codec 71/71
        run: |
          ./protocol-generator/julia/run-conformance.sh

      # Gate 2 — S3 peer machinery: two Julia peers handshake over loopback TCP, exercising
      # §6.5 auth-before-resolve (401 vs 404) and §6.11 request_id demux on the single-threaded
      # Task scheduler (intra-container 127.0.0.1, works under --network=none).
      - name: S3 — loopback smoke
        run: |
          ./protocol-generator/julia/run-smoke.sh

      # Gate 3 — S4 live-peer validate-peer --profile core (must stay 0 FAIL). The Julia host
      # (bin/peer.jl) + the Go oracle ELF run together in the image over loopback,
      # --network=none. run-s4.sh writes status/CONFORMANCE-REPORT.json; assert
      # summary.failed == 0 (the green gate).
      - name: S4 — validate-peer --profile core (0 FAIL)
        run: |
          . tools/podman-caps.sh
          podman run $PODMAN_RUN_CAPS --rm --network=none -v "$PWD":/work:Z -e PORT=7799 \
            "$IMAGE" sh /work/protocol-generator/julia/run-s4.sh
          python3 - <<'PY'
          import json, sys
          s = json.load(open("protocol-generator/julia/status/CONFORMANCE-REPORT.json"))["summary"]
          print("summary:", s)
          if s.get("failed", 1) != 0:
              print("::error::validate-peer core has FAILs — gate not green"); sys.exit(1)
          PY
