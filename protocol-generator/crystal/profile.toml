status                  = "host"
handler_register_call   = "none -- @handlers is an instance var, wire register op only"
handler_body_shape      = "entity-native: expression_path -> compute/literal"
dispatch_read_site      = "dispatch -- @handlers[stripped]? then entity_native_dispatch(pattern); src/entity_core/peer.cr:365-369"
consumer_register_call  = "Store#register_tree_consumer / register_content_consumer"
frame_budget_accessor   = "absent"
handle_lifecycle        = "absent -- unregister is the wire op"
packaging_unit          = "git"
package_name            = "entity_core_protocol"
