[[doc]]
path  = "README.md"
title = "entity-core-keystone — overview, build, honest independence"
blurb = "What the keystone is, the three arms (protocol-generator / ffi-generator / research), the make+podman bare-host build, and the precise independence framing."
group = "Overview"

# `docs/status/STATUS.md` WAS declared here and is NO LONGER — [ADR-0031], 2026-08-23.
# `docs/status/` now publishes nothing. A rolling status file is working memory: dated
# measurements, seat names, blockers, half-verified numbers. Publishing it put exactly the
# material the *spec text is not our log* rule exists to keep out onto the public surface,
# and the ecosystem measurement found 466 of 670 unreachable commit citations living in
# these files fleet-wide. Sweeping them was the wrong fix — they regenerate the problem by
# being used as intended. This is one line instead, and our own STATUS.md already opened by
# deferring to CONFORMANCE-MATRIX.md for every number, which is the argument for it.
# It is currently on public `master`, so removing the declaration is a DELETION against the
# published tree: declared in `.release-removals` at the repo root, which is what makes the
# `public-regress` gate pass. Reversible — restore the `[[doc]]` block.

