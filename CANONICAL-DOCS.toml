# Canonical-docs declaration — the publishable doc surface the content leaf
# ingests for the keystone domain ([internal] CANONICAL-DOCS-FORMAT.md).
# Only docs at NON-scrubbed paths are listed: the release builder drops
# **/HANDOFF*, *REVIEW*, *EXPLORATION*, PROPOSAL-*, RESPONSE-*, STATUS*,
# WORKSTREAMS.md, .claude/, CLAUDE.md — so the canonical surface (conformance
# matrix + research diagnostics) lives under names that survive the cut. The
# internal STATUS.md / WORKSTREAMS.md are intentionally NOT declared (ephemeral
# steward planning, honest absence per ADR-0012); the project's workstream shape
# is conveyed by the README's three-arms section.

[project]
name   = "Entity Core Keystone"
slug   = "entity-core-keystone"
repo   = "entity-core-keystone"
github = "https://github.com/EntityChurch/entity-core-keystone"
intro  = """
The keystone of the Entity Core arch: a generator that emits a full core
protocol peer (entity-core-protocol-<lang>) for any target language from the
pinned spec snapshot (currently v0.8.2), plus a language-agnostic codec C-ABI.
The cohort is 46 generated core peers, 45 of them measured. Conformance state as
of 2026-08-21 spans two oracle pins and is NOT uniformly green: the 5 lockstep
peers re-run at oracle c1b0708 all FAIL the newly-landed core capability checks,
and the other 40 still carry their superseded de8f807 measurement, which does not
carry forward. The failures are an unimplemented spec feature (the section 5.6
minted-capability temporal ceiling) rather than regressions. The conformance
matrix is authoritative and carries the per-peer transparency contract — spec
version, oracle commit, codec/crypto strategy, known gaps — and it states plainly
which rows are current and which are historical. Honest scope: these peers are
generated, so they share a generation lineage — the strong claim is spec-forced
convergence across many different languages/runtimes, not 46 independently-authored
code bases (ADR-0012). This is a 0.8 pre-release surface: oracle-pinned and
reproducible, still evolving as spec amendments run through the generator.
"""

