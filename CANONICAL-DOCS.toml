# Canonical-docs declaration — the publishable doc surface for the keystone domain
# ([internal] CANONICAL-DOCS-FORMAT.md).
#
# ** THIS IS A KEEP-LIST, NOT A SCRUB-LIST. Read that before adding or removing. **
# `canon-filter` (entity-core-devops release-builder, `internal/canon`) deletes every
# file it does NOT find declared here, within its scope. Undeclared is not "left
# alone" — it is "removed from the public tree." The scope is exact and worth
# knowing, because it decides what a mistake here can destroy:
#
#   * ONLY PROSE IS EVER DROPPED — `.md .markdown .rst .txt .adoc`, plus `.patch`
#     and `.diff` (records, not inputs). A `.py`, `.sh`, `.cbor`, `.json` or any
#     source file is NEVER dropped, wherever it sits.
#   * ...and only when that prose is either LOOSE AT THE TOP LEVEL (no `/` in the
#     path) or under a doc-root PREFIX: `docs/ doc/ reviews/ review/ research/
#     explorations/ exploration/ proposals/ proposal/ validation/ stewardship/
#     status/ reports/ report/ notes/ handoffs/ handoff/ audits/ audit/ planning/
#     design/ designs/`. Prefix means at the START of the path, so
#     `protocol-generator/<lang>/status/*.md` is NOT in scope and never has been.
#   * everything else is always kept.
#
# ** CORRECTED 2026-08-24. This header said "droppable REGARDLESS OF EXTENSION." **
# That was true of the tool when written and is now false: `canon-filter` was fixed
# on 2026-08-23 to prose-only, because the old rule shipped an `entity-core-go`
# mirror that FAILED ITS OWN TEST SUITE on a clean clone — it had stripped four
# conformance `.cbor` vectors and a `.json` baseline that published code reads,
# purely because they were filed under `docs/validation/`. Location is not function.
# Verified here by reading `internal/canon/canon.go` (`if !proseExt[ext] { return
# nil }`), not by inference and not from a summary. Consequence for us: of the four
# diagnostics moved out of `research/` on 2026-08-23, only the `.md` one was ever at
# risk; the `.sh`/`.py` pair was already safe. The move stands — they belong with
# the work they support — but the REASON recorded for it was wrong.
#
# `README.md` is force-kept by the tool even if omitted. `CANONICAL-DOCS.toml`
# keeps itself.
#
# The header that used to sit here described a scrub-list of name patterns
# (`**/HANDOFF*`, `PROPOSAL-*`, `CLAUDE.md`, …). That was the wrong mental model in
# the dangerous direction: it reads as "undeclared files are dropped only if they
# match a pattern," and under it eight already-public top-level files sat undeclared
# for months, one release away from silent deletion. Declaring is the only thing
# that keeps a file.
#
# ** WHAT `docs/status/` PUBLISHES: NOTHING ([ADR-0031], 2026-08-23). **
# The dated `STATUS-*`/`HANDOFF-*`/`CHECKPOINT-*`/`SESSION-*` snapshots under
# `docs/status/` are internal working memory: no scrub obligation, no pin hygiene, no
# audience. Write them for the next session.
#
# ** The single rolling canonical log DOES publish, and it is now `docs/STATUS.md`. **
# [ADR-0031] was CORRECTED the day it landed — as first written it banned the directory,
# which took the rolling log with it, and the evidence never supported that. The six repos
# in its concentration table hold all 466 unreachable citations; neither `entity-core-protocol`
# nor this repo appears, because both measure ZERO. A rule derived from six repos' logs was
# applied first to the two it did not describe, and `entity-core-protocol` had already lost a
# clean STATUS.md to it.
#
# The fix is a MOVE, not a re-declaration, and that is the durable part: with the rolling log
# at `docs/STATUS.md`, the two kinds are separable by PATH instead of by remembering a
# filename. `docs/status/` can then be dropped wholesale — as `.release-removals` does — and
# the canonical log is never in the blast radius. That property's absence is what made this
# mistake available in the first place.
#
# (This header asserted the answer twice in opposite directions inside a week. Both times the
# rule lived only in a comment here. It is now in an ADR, which is where it should have been.)
#
# ** THE ECOSYSTEM ADRs DO NOT PUBLISH — standing operator ruling, 2026-08-24. **
# Every file under `docs/adr/` is deliberately NOT declared and strips at release. If a
# release simulation reports all 33 as dropped, that is the correct answer, not a finding.
# Citing `[ADR-NNNN]` by NUMBER in published prose stays fine — the number references a
# decision, not a promise of a file — but published prose must never send a reader to the
# PATH, because that directory does not exist in the mirror. (There is also no automated
# transport for the copies: [ADR-0030] specified injection, was executed and retracted, and
# the question is blocked behind a decision on publishing ADRs at all. We hand-sync and say
# so in the commit message. Do not build a local mechanism for it.)
#
# `WORKSTREAMS.md` stays undeclared too — ephemeral steward planning, honest absence per
# [ADR-0012]; the README's three-arms section conveys the shape.

[project]
name   = "Entity Core Keystone"
slug   = "entity-core-keystone"
repo   = "entity-core-keystone"
github = "https://github.com/EntityChurch/entity-core-keystone"
intro  = """
The keystone of the Entity Core arch: a generator that emits a full core
protocol peer (entity-core-protocol-<lang>) for any target language from the
pinned spec snapshot (currently v0.8.2), plus a language-agnostic codec C-ABI.
The cohort is 46 generated core peers, 45 of them measured — all 45 against ONE
oracle pin, the 755-check set 95edd774..., nothing carried forward. That pin is a
content digest of the oracle's own check set rather than a commit hash, per
ADR-0012 Amendment 1: published commits are authored fresh at the release
boundary, so a hash from our internal history resolves for no outside reader,
while a digest survives it. Conformance state is NOT uniformly green: 13 peers
pass --profile core at 0-FAIL and are the only ones publishable today (tiers M1
and M2, five and eight); 29 more are scored and fail the newly-landed core
capability checks, 25 of them failing nothing else and with a byte-identical
breakdown. Those failures are one unimplemented spec feature (the section 5.6
minted-capability temporal ceiling) measured across the cohort, rather than 29
regressions. Three further peers produced INVALID MEASUREMENTS — starved runs
that are quarantined, not scored — and one is unmeasured. The conformance matrix
is authoritative and carries the per-peer transparency contract: spec version,
oracle pin, codec/crypto strategy, known gaps, and which rows are current versus
historical. Honest scope: these peers are generated, so they share a generation
lineage — the strong claim is spec-forced convergence across many different
languages and runtimes, not 46 independently-authored code bases (ADR-0012).
This is a 0.8 pre-release surface: digest-anchored and reproducible, still
evolving as spec amendments run through the generator.
"""

