group = "Overview"

# The program-level view: which seats this repo sits between, what is measured, what is
# queued and what "finished" looks like. Declared because it is the only answer to an
# outsider's "where is this going", and because `docs/STATUS.md` and `README.md` both cite
# it -- a published file naming a path the release strips is exactly what `link-gate` check 2
# exists to catch. It carries no per-peer numbers of its own: CONFORMANCE-MATRIX.md is
# authoritative and this file says so at the top.
[[doc]]
path  = "docs/PROGRAM.md"
title = "The program — where keystone sits, what it owes, and how it ends"
blurb = "Keystone's position and trajectory: the four seats it sits between, the state of every verification axis, the measured size of the queued work, and what freeze looks like when the core protocol stops moving."
group = "Overview"

# Declared because the alternative is worse, and because of what it says. `docs/STATUS.md`
# (published) cites it, and a published file naming a path the release strips is the exact
# defect `link-gate` check 2 exists to catch. On the merits: this repo is the conformance
# anchor, so a rule we invent for our own peers reads to an outsider as a rule the protocol
# imposes. A reader who cannot tell those apart cannot correctly scope what a ground-up
# implementation owes — which is Layer 1 and nothing else. Saying so in public is the
# anti-overclaim move, not a commitment to the in-flight contract it describes.
[[doc]]
path  = "docs/CONTRACT-LAYERS.md"
title = "Contract layers — what binds every peer, what binds a keystone peer, what binds this repo"
blurb = "The boundary between core protocol conformance (binds every implementation), the keystone peer contract (binds only peers this repo generates), and this repo's own project discipline. States what a ground-up implementation does and does not owe."
group = "Overview"

# Declared for the same reason CONTRACT-LAYERS is: an adopter reading a conformance
# number from this repo is entitled to know which verification artifacts we CONSUME
# (the oracle, arch's corpora) and which we AUTHOR, and what an authored one is
# allowed to conclude. Publishing the constraint is the anti-overclaim move.
[[doc]]
path  = "docs/VERIFICATION-ARCHITECTURE.md"
title = "Verification architecture — what this repo may author, what it may conclude, and what it owes upstream"
blurb = "The three kinds of verification artifact this repo produces — census probe, transcription of a normative reading, and independent check — with the obligations and the expiry rule for each. States why an authored check is a second measurement and never a second authority."
group = "Overview"

