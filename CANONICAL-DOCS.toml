# Canonical-docs declaration — the publishable doc surface for the keystone domain
# ([internal] CANONICAL-DOCS-FORMAT.md).
#
# ** THIS IS A KEEP-LIST, NOT A SCRUB-LIST. Read that before adding or removing. **
# `canon-filter` (entity-core-devops release-builder, `internal/canon`) deletes every
# file it does NOT find declared here, within its scope. Undeclared is not "left
# alone" — it is "removed from the public tree." The scope is exact and worth
# knowing, because it decides what a mistake here can destroy:
#
#   * loose TOP-LEVEL prose (`.md .markdown .rst .txt .adoc`, no `/` in the path) —
#     droppable. Top-level non-prose (LICENSE, NOTICE, VERSION, Makefile) is safe.
#   * anything under a doc-root PREFIX — `docs/ research/ reviews/ status/
#     validation/ stewardship/ proposals/ notes/ handoffs/ audits/ design/ …` —
#     droppable regardless of extension. Prefix means at the START of the path, so
#     `protocol-generator/<lang>/status/*.md` is NOT in scope and never has been.
#   * everything else — source, configs, vectors, spec-data — always kept.
#
# `README.md` is force-kept by the tool even if omitted. `CANONICAL-DOCS.toml`
# keeps itself.
#
# The header that used to sit here described a scrub-list of name patterns
# (`**/HANDOFF*`, `PROPOSAL-*`, `CLAUDE.md`, …). That was the wrong mental model in
# the dangerous direction: it reads as "undeclared files are dropped only if they
# match a pattern," and under it eight already-public top-level files sat undeclared
# for months, one release away from silent deletion. Declaring is the only thing
# that keeps a file.
#
# ** WHAT `docs/status/` PUBLISHES: NOTHING ([ADR-0031], 2026-08-23). **
# Both kinds — the singular rolling `STATUS.md` and the dated `STATUS-*`/`HANDOFF-*`/
# `CHECKPOINT-*` snapshots beside it — are internal working memory now, with no scrub
# obligation, no pin hygiene, and no audience. `STATUS.md` was the single declared
# exception until today; the entry is removed below with the reasoning inline.
# (This header asserted the opposite twice, in opposite directions, within a week.
# The rule is now in an ADR that ships into this repo at `docs/adr/ecosystem/`, which
# is where it should have been.)
#
# `docs/adr/ecosystem/` is injected and read-only ([ADR-0030]) and is deliberately
# NOT declared. `WORKSTREAMS.md` stays undeclared too — ephemeral steward planning,
# honest absence per [ADR-0012]; the README's three-arms section conveys the shape.

[project]
name   = "Entity Core Keystone"
slug   = "entity-core-keystone"
repo   = "entity-core-keystone"
github = "https://github.com/EntityChurch/entity-core-keystone"
intro  = """
The keystone of the Entity Core arch: a generator that emits a full core
protocol peer (entity-core-protocol-<lang>) for any target language from the
pinned spec snapshot (currently v0.8.2), plus a language-agnostic codec C-ABI.
The cohort is 46 generated core peers, 45 of them measured — all 45 against ONE
oracle pin, the 755-check set 95edd774..., nothing carried forward. That pin is a
content digest of the oracle's own check set rather than a commit hash, per
ADR-0012 Amendment 1: published commits are authored fresh at the release
boundary, so a hash from our internal history resolves for no outside reader,
while a digest survives it. Conformance state is NOT uniformly green: 13 peers
pass --profile core at 0-FAIL and are the only ones publishable today (tiers M1
and M2, five and eight); 29 more are scored and fail the newly-landed core
capability checks, 25 of them failing nothing else and with a byte-identical
breakdown. Those failures are one unimplemented spec feature (the section 5.6
minted-capability temporal ceiling) measured across the cohort, rather than 29
regressions. Three further peers produced INVALID MEASUREMENTS — starved runs
that are quarantined, not scored — and one is unmeasured. The conformance matrix
is authoritative and carries the per-peer transparency contract: spec version,
oracle pin, codec/crypto strategy, known gaps, and which rows are current versus
historical. Honest scope: these peers are generated, so they share a generation
lineage — the strong claim is spec-forced convergence across many different
languages and runtimes, not 46 independently-authored code bases (ADR-0012).
This is a 0.8 pre-release surface: digest-anchored and reproducible, still
evolving as spec amendments run through the generator.
"""

